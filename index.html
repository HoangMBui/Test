<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Tool</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .canvas {
      background-color: #f5f5f5;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
    }
    .shape.selected::after {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      border: 2px solid blue;
    }
    .badge {
      display: none;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body class="flex">
  <!-- Sidebar -->
  <div class="w-64 h-screen bg-gray-900 p-4 flex flex-col">
    <button id="rectangle-btn" class="bg-white text-black rounded px-2 py-1 mb-2">Rectangle</button>
    <button id="circle-btn" class="bg-white text-black rounded px-2 py-1 mb-2">Circle</button>
    <button id="text-btn" class="bg-white text-black rounded px-2 py-1 mb-2">Text</button>
  </div>
  <!-- Canvas -->
  <div id="canvas" class="flex-1 h-screen bg-gray-900 canvas"></div>

  <script src="app.js"></script>
</body>
</html>
